project:
  name: semantic-similarity-llm-eval
  seed: 42
  # If true, scripts derive input/output paths from data.dataset and sample_size.
  # This prevents writing SciQ outputs into an NQ result folder.
  auto_paths: true
  # If true, similarity/evaluation artifacts are written under
  # outputs/experiments/results_<dataset>_<sample>/runs/<run_id>/ instead of overwriting prior runs.
  preserve_runs: true
  # auto creates a new run for similarity computation and makes evaluation use
  # the latest completed run. Set a fixed value to intentionally rerun one run.
  run_id: auto

data:
  # 可选值：
  # sciq
  # nq
  # simple_questions_wiki
  # truthfulQA
  dataset: sciq

  # 老师给的数据目录
  data_root: data/raw
  data_file: merged_fb.json

  # 如果只想先测试，可以设置 sample_size: 20
  # 如果想跑全量，改成 null
  sample_size: 500

  prediction_dir: data/interim/predictions
  similarity_dir: data/interim/similarity

llm:
  provider: qwen
  model: qwen2.5-7b-instruct
  run_name: qwen25_7b_instruct
  temperature: 0.0
  max_tokens: 64
  sleep_seconds: 0.2
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key_env: DASHSCOPE_API_KEY

prediction:
  # These path fields are auto-filled when project.auto_paths is true.
  input_file: data/raw/sciq/merged_fb.json

  output_file: data/interim/predictions/sciq_qwen25_7b_instruct_predictions_500.jsonl

  use_support: false

embedding:
  models:
    - sentence-transformers/all-MiniLM-L6-v2
    - BAAI/bge-base-en-v1.5
  batch_size: 32

similarity:
  input_file: data/interim/predictions/sciq_qwen25_7b_instruct_predictions_500.jsonl
  output_file: data/interim/similarity/sciq_qwen25_7b_instruct_similarity_500.jsonl

evaluation:
  input_file: data/interim/similarity/sciq_qwen25_7b_instruct_similarity_500.jsonl
  similarity_threshold: 0.75
  label_field: correct_label
  # auto uses reference_answer for NQ and ground_truth for other datasets.
  reference_field: auto

output:
  experiments_dir: outputs/experiments
  results_dir: outputs/experiments/results_sciq_500
  figure_dir: outputs/experiments/results_sciq_500/figures
  table_dir: outputs/experiments/results_sciq_500/tables
  failure_case_dir: outputs/experiments/results_sciq_500/failure_cases
  report_asset_dir: outputs/experiments/results_sciq_500/report_assets
